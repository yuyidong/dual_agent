[project]
name = "dual-agent-opf"
version = "0.1.0"
description = "Decision-focused dual-agent learning for PV forecasting and stochastic distribution OPF surrogates."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
opendss = [
  "opendssdirect.py>=0.9",
]
dev = [
  "pytest>=8.0",
]
tracking = [
  "swanlab",
]
baseline = [
  "pyomo>=6.8",
  "highspy>=1.7",
]
station-consistency = [
  "cvxpy>=1.4",
  "highspy>=1.7",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
